<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kod — SQL на настоящей базе в браузере</title>
<meta name="description" content="Бесплатный тренажёр SQL: настоящая база данных прямо в браузере, задачи проверяются по результату запроса." />
<script src="assets/sql-wasm.js"></script>
<style>
  :root {
    --bg: #08120c; --panel: #0f1f16; --line: #1d3325; --line-soft: #2a4a37;
    --ink: #cfe8d8; --dim: #89a996; --green: #25d366; --bright: #8ff0b0;
    --warn: #ffb4a0; --warn-line: #8a3a2a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 "JetBrains Mono", ui-monospace, "DejaVu Sans Mono", monospace; }
  header { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex;
           align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand { font-size: 22px; font-weight: 700; color: var(--bright); letter-spacing: -0.5px; }
  .brand small { color: var(--dim); font-weight: 400; font-size: 12px; letter-spacing: 0; }
  .free { margin-left: auto; font-size: 11px; color: var(--bg); background: var(--green);
          padding: 4px 9px; border-radius: 3px; font-weight: 700; letter-spacing: 0.06em; }
  main { display: grid; grid-template-columns: 1fr; gap: 14px; padding: 16px; max-width: 1100px; margin: 0 auto; }
  @media (min-width: 900px) { main { grid-template-columns: 300px 1fr; align-items: start;
    grid-template-areas: "tasks work" "tasks out"; } .tasks { grid-area: tasks; } .work { grid-area: work; } .out { grid-area: out; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
  .tasks ol { margin: 8px 0 0; padding-left: 20px; }
  .tasks li { padding: 6px 0; cursor: pointer; color: var(--dim); }
  .tasks li[aria-current="true"] { color: var(--bright); }
  .tasks li.done::after { content: " ✓"; color: var(--green); }
  .label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }
  h1 { font-size: 19px; margin: 8px 0 6px; color: #fff; }
  p.prompt { color: var(--ink); margin: 0 0 12px; }
  textarea { width: 100%; min-height: 132px; background: #06110b; color: var(--bright);
             border: 1px solid var(--line-soft); border-radius: 4px; padding: 12px;
             font: 14px/1.7 "JetBrains Mono", ui-monospace, monospace; resize: vertical; }
  .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border-radius: 4px; padding: 11px 18px; border: 1px solid var(--line-soft);
           background: transparent; color: var(--ink); }
  button.primary { background: var(--green); border-color: var(--green); color: #06140c; font-weight: 700; }
  button.ghost { color: var(--dim); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 400; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; }
  .verdict { margin-top: 12px; padding: 12px; border: 1px solid var(--line-soft); border-radius: 4px; }
  .verdict.ok { color: var(--bright); border-color: var(--green); }
  .verdict.bad { color: var(--warn); border-color: var(--warn-line); }
  .hint { margin-top: 10px; color: var(--dim); font-size: 13px; display: none; }
  .hint.on { display: block; }
  .schema { font-size: 12.5px; color: var(--dim); margin-top: 6px; }
  code { color: var(--bright); }
  footer { color: var(--dim); font-size: 11.5px; padding: 4px 20px 26px; max-width: 1100px; margin: 0 auto; }
</style>
</head>
<body>
<header>
  <div class="brand">kod <small>· SQL, настоящая база прямо в браузере</small></div>
  <div class="free">БЕСПЛАТНО</div>
</header>

<main>
  <section class="card tasks">
    <div class="label">Задачи</div>
    <ol id="task-list"></ol>
    <div class="schema" id="schema"></div>
  </section>

  <section class="card work">
    <div class="label" id="task-label">Задача</div>
    <h1 id="task-title"></h1>
    <p class="prompt" id="task-prompt"></p>
    <textarea id="editor" spellcheck="false"></textarea>
    <div class="row">
      <button class="primary" id="check">Проверить</button>
      <button class="ghost" id="hint-button">Подсказка</button>
      <button class="ghost" id="reset">Вернуть пример</button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="verdict" id="verdict" hidden></div>
  </section>

  <section class="card out">
    <div class="label">Результат запроса</div>
    <div id="output" style="margin-top:10px;color:var(--dim)">Нажми «Проверить».</div>
  </section>
</main>

<footer>
  Ответ проверяется не сравнением текста, а результатом: твой запрос и эталонный
  выполняются на одной и той же базе, и строки должны совпасть.
</footer>

<script>
const SCHEMA = `
  CREATE TABLE groups (id INTEGER PRIMARY KEY, name TEXT, teacher TEXT);
  INSERT INTO groups VALUES (1,'Matematika-1','Karimov'),(2,'Fizika-2','Yusupova'),(3,'Ingliz-3','Smith');
  CREATE TABLE students (id INTEGER PRIMARY KEY, name TEXT, age INTEGER, city TEXT, group_id INTEGER);
  INSERT INTO students VALUES
    (1,'Азиз',21,'Tashkent',1),(2,'Малика',22,'Tashkent',2),(3,'Тимур',21,'Samarqand',1),
    (4,'Дилноза',23,'Tashkent',1),(5,'Санжар',19,'Buxoro',3),(6,'Нилуфар',24,'Samarqand',2),
    (7,'Бекзод',20,'Tashkent',3),(8,'Зарина',22,'Buxoro',2);
  CREATE TABLE grades (id INTEGER PRIMARY KEY, student_id INTEGER, subject TEXT, score REAL);
  INSERT INTO grades VALUES
    (1,1,'matematika',4.5),(2,1,'fizika',4.0),(3,2,'fizika',5.0),(4,3,'matematika',3.5),
    (5,4,'matematika',4.8),(6,5,'ingliz',4.2),(7,6,'fizika',4.9),(8,7,'ingliz',3.9),(9,8,'fizika',4.4);
`;

const TASKS = [
  {
    title: "Все студенты",
    prompt: "Выведи имена и возраст всех студентов.",
    reference: "SELECT name, age FROM students;",
    hint: "SELECT name, age FROM students; — перечисли колонки через запятую.",
  },
  {
    title: "Только из Ташкента",
    prompt: "Выведи имена студентов из города Tashkent, кому больше 20 лет.",
    reference: "SELECT name FROM students WHERE city = 'Tashkent' AND age > 20;",
    hint: "WHERE city = 'Tashkent' AND age > 20 — строку города пишем в одинарных кавычках.",
  },
  {
    title: "Средний возраст по городам",
    prompt: "Для каждого города выведи город и средний возраст его студентов.",
    reference: "SELECT city, AVG(age) AS average_age FROM students GROUP BY city;",
    hint: "GROUP BY city и AVG(age) — без GROUP BY получится одно число на всю таблицу.",
  },
  {
    title: "Города, где учатся старшие",
    prompt: "Выведи города, где средний возраст студентов больше 21.",
    reference: "SELECT city FROM students GROUP BY city HAVING AVG(age) > 21;",
    hint: "Условие на результат группировки ставится в HAVING, а не в WHERE.",
  },
  {
    title: "Студент и его группа",
    prompt: "Выведи имя студента и название его группы (нужны обе таблицы).",
    reference: "SELECT students.name, groups.name FROM students JOIN groups ON students.group_id = groups.id;",
    hint: "JOIN groups ON students.group_id = groups.id — связь по идентификатору группы.",
  },
  {
    title: "Кто учится лучше всех",
    prompt: "Выведи имена студентов, у которых есть оценка выше 4.7.",
    reference: "SELECT DISTINCT students.name FROM students JOIN grades ON grades.student_id = students.id WHERE grades.score > 4.7;",
    hint: "Без DISTINCT имя может повториться, если оценок несколько.",
  },
];

let db = null;
let current = 0;

function normalize(rows) {
  return rows.map((row) => row.map((v) => (v === null ? "∅" : String(v))).sort()).sort((a, b) => JSON.stringify(a).localeCompare(JSON.stringify(b)));
}

function runSql(sql) {
  const res = db.exec(sql);
  if (res.length === 0) return [];
  return res[res.length - 1].values;
}

function renderTable(rows) {
  if (!rows.length) return '<div style="color:var(--dim)">Запрос не вернул ни одной строки.</div>';
  return '<table><tbody>' + rows.slice(0, 12).map((r) => "<tr>" + r.map((c) => "<td>" + (c === null ? "∅" : String(c)) + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
}

function selectTask(index) {
  current = index;
  const task = TASKS[index];
  document.getElementById("task-label").textContent = "Задача " + (index + 1) + " из " + TASKS.length;
  document.getElementById("task-title").textContent = task.title;
  document.getElementById("task-prompt").textContent = task.prompt;
  document.getElementById("editor").value = task.starter || "SELECT ";
  const verdict = document.getElementById("verdict");
  verdict.hidden = true;
  document.getElementById("output").innerHTML = "Нажми «Проверить».";
  document.getElementById("hint").classList.remove("on");
  document.querySelectorAll("#task-list li").forEach((li, i) => li.setAttribute("aria-current", String(i === index)));
}

function check() {
  const sql = document.getElementById("editor").value;
  const verdict = document.getElementById("verdict");
  let mine;
  try {
    mine = runSql(sql);
  } catch (error) {
    verdict.hidden = false;
    verdict.className = "verdict bad";
    verdict.textContent = "База ответила ошибкой: " + error.message + " Проверь кавычки, запятые и точку с запятой.";
    return;
  }
  const expected = runSql(TASKS[current].reference);
  const same = JSON.stringify(normalize(mine)) === JSON.stringify(normalize(expected));
  document.getElementById("output").innerHTML = renderTable(mine);
  verdict.hidden = false;
  if (same) {
    verdict.className = "verdict ok";
    verdict.textContent = "Пройдено. Строк " + mine.length + ", колонок " + (mine[0] ? mine[0].length : 0) + " — совпало с эталоном.";
    document.querySelectorAll("#task-list li")[current].classList.add("done");
  } else {
    verdict.className = "verdict bad";
    verdict.textContent = "Пока не то: у эталона строк " + expected.length +
      (mine[0] ? ", колонок " + mine[0].length + " против " + expected[0].length : "") +
      ". Порядок колонок и строк значения не имеет — имеет смысл сам набор.";
  }
}

window.addEventListener("DOMContentLoaded", async () => {
  const list = document.getElementById("task-list");
  TASKS.forEach((task, index) => {
    const li = document.createElement("li");
    li.textContent = task.title;
    li.addEventListener("click", () => selectTask(index));
    list.appendChild(li);
  });
  document.getElementById("schema").innerHTML =
    "students(id, name, age, city, group_id)<br>groups(id, name, teacher)<br>grades(id, student_id, subject, score)";

  document.getElementById("check").addEventListener("click", check);
  document.getElementById("reset").addEventListener("click", () => selectTask(current));
  document.getElementById("hint-button").addEventListener("click", () => {
    document.getElementById("hint").textContent = "Подсказка: " + TASKS[current].hint;
    document.getElementById("hint").classList.add("on");
  });

  const SQL = await initSqlJs({ locateFile: (file) => "assets/" + file });
  db = new SQL.Database();
  db.run(SCHEMA);
  selectTask(0);
  document.body.dataset.ready = "true";
});
</script>
</body>
</html>
